<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake Math ครูเค้ก</title><style>body{font-family:sans-serif;text-align:center;background:linear-gradient(135deg,#ffd6ec,#d7f0ff,#d9ffe4)}canvas{border:6px solid #ff80ab;border-radius:20px;background:#fff}button{padding:8px 14px;margin:4px} .panel{background:#fff;padding:10px;border-radius:16px;max-width:900px;margin:auto}</style></head><body><h1>🐍 งูกินหางคิดเลขเร็ว</h1><div class="panel"><div id="question">กดเริ่มเกม</div><p>ไฟล์ตัวอย่างรวมฟังก์ชันหลัก: เลือกระดับ, เลือกเครื่องหมาย, งูกินแอปเปิลคำตอบ</p><div><label><input type="radio" name="difficulty" checked>ง่าย</label><label><input type="radio" name="difficulty">ปานกลาง</label><label><input type="radio" name="difficulty">ยาก</label></div><div><label><input type="checkbox" checked>+</label><label><input type="checkbox" checked>-</label><label><input type="checkbox" checked>×</label><label><input type="checkbox" checked>÷</label></div><button>เริ่มเกม</button><button>หยุดเกม</button><canvas width="500" height="500"></canvas><h3>💖 พัฒนาโดย ครูเค้ก</h3></div></body></html>
